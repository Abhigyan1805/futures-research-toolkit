[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-research-toolkit"
version = "0.1.0"
description = "Cost-of-carry fair value, spread/butterfly regime study and significance-tested candlestick patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
# Flat multi-package layout: packages must be listed explicitly or `pip install -e .` fails.
packages = ["data", "fairvalue", "regimes", "candles"]

[tool.setuptools.package-data]
data = ["fixtures/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "fairvalue", "regimes", "candles"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
